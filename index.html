<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frutea · Control de defectos</title>
<meta name="theme-color" content="#B80F63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Defectos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --magenta:#B80F63; --magenta-2:#D81B7A; --cherry:#5C0B30; --leaf:#3B7A3A;
  --bg:#FBF6F8; --surface:#FFFFFF; --ink:#24131B; --muted:#7A6670; --line:#EADDE3;
  --soft:#F8E7EF; --ok:#2F7A3E; --ok-soft:#E5F2E6; --bad-soft:#FBE4EC;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --magenta:#F0509C; --magenta-2:#FF6FB0; --cherry:#FFC2DA; --leaf:#7BC17A;
    --bg:#170C11; --surface:#22141B; --ink:#F6E9EF; --muted:#B9A2AD; --line:#3A2630;
    --soft:#341A27; --ok:#7CCB86; --ok-soft:#173022; --bad-soft:#3A1726;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --magenta:#F0509C; --magenta-2:#FF6FB0; --cherry:#FFC2DA; --leaf:#7BC17A;
  --bg:#170C11; --surface:#22141B; --ink:#F6E9EF; --muted:#B9A2AD; --line:#3A2630;
  --soft:#341A27; --ok:#7CCB86; --ok-soft:#173022; --bad-soft:#3A1726;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45; -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--magenta)}
header{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
  background:var(--magenta); color:#fff;
  display:flex; align-items:center; gap:10px; padding:10px 16px;
}
header svg{width:38px;height:38px;flex:none}
.brandlogo{height:36px;width:auto;display:block}
.brand{font-weight:800;font-size:1.6rem;letter-spacing:-.03em;line-height:1}
.brand-sub{font-size:.8rem;opacity:.85;margin-left:auto;text-align:right;line-height:1.2}
main{max-width:560px;margin:0 auto;padding:16px 14px 120px}
section{margin-bottom:22px}
h2{font-size:1.05rem;font-weight:800;margin:0 0 10px;color:var(--cherry)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
input[type=text],input[type=date],input[type=number]{
  font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0;
}
input:focus-visible,button:focus-visible{outline:3px solid var(--magenta-2);outline-offset:2px}

.photo{
  background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;
  overflow:hidden;position:relative;
}
.photo img{display:block;width:100%;max-height:340px;object-fit:cover}
.photo .empty{padding:26px 16px;text-align:center;color:var(--muted)}
.photo-actions{display:flex;gap:8px;padding:10px;border-top:1.5px solid var(--line)}
.photo:has(img:not([hidden])){border-style:solid}

.btn{
  font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 14px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;
}
.btn.primary{background:var(--magenta);color:#fff}
.btn.ghost{background:var(--soft);color:var(--magenta)}
.btn.grow{flex:1}
.btn:disabled{opacity:.45}

.list{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto 3.6rem;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .name input{padding:6px 8px;font-weight:600}
.row .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{
  width:44px;height:44px;border-radius:12px;border:0;font:inherit;font-size:1.4rem;font-weight:600;
  background:var(--soft);color:var(--magenta);cursor:pointer;
}
.stepper input{width:3.4rem;text-align:center;padding:8px 2px;font-variant-numeric:tabular-nums;font-weight:600;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.row.export{background:var(--ok-soft)}
.row.export .name{color:var(--ok)}
.row.export .stepper button{background:var(--surface);color:var(--ok)}
.del{border:0;background:none;color:var(--muted);font:inherit;font-size:.8rem;padding:2px 0;cursor:pointer;text-decoration:underline}
.add{width:100%;border-top:1px solid var(--line);border-radius:0;background:transparent;color:var(--magenta)}

.result{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px}
.result .big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{border-radius:12px;padding:12px}
.kpi.bad{background:var(--bad-soft)}
.kpi.good{background:var(--ok-soft)}
.kpi .v{font-size:2.4rem;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.kpi.bad .v{color:var(--magenta)}
.kpi.good .v{color:var(--ok)}
.kpi .l{font-size:.85rem;color:var(--muted);margin-top:4px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin:14px 0 6px}
.bar span{display:block;height:100%;transition:width .25s}
.total{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted)}
.total b{color:var(--ink);font-variant-numeric:tabular-nums}

.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:6;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
}
.dock .inner{max-width:560px;margin:0 auto;display:flex;gap:8px}

dialog{border:0;padding:0;border-radius:18px;max-width:min(560px,94vw);width:100%;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(20,5,12,.6)}
.dlg-body{padding:14px;max-height:72vh;overflow:auto}
.dlg-body img{width:100%;display:block;border-radius:10px;border:1px solid var(--line)}
.dlg-actions{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<main>
  <section>
    <h2>Datos de la muestra</h2>
    <div class="fields">
      <label class="f full">Productor<input type="text" id="productor" autocomplete="off" list="productores"></label>
      <label class="f">Huerto / cuartel<input type="text" id="cuartel" autocomplete="off"></label>
      <label class="f">Variedad<input type="text" id="variedad" autocomplete="off" list="variedades"></label>
      <label class="f">Fecha<input type="date" id="fecha"></label>
      <label class="f">Evaluador<input type="text" id="evaluador" autocomplete="off"></label>
    </div>
    <datalist id="productores">
      <option value="Diego Pacheco Álvarez"><option value="Agrícola Las Palmeras SPA"><option value="Agrícola Tierra Buena">
      <option value="Valle Hermoso"><option value="Agrícola San Antonio"><option value="Manfrut">
      <option value="Guillermo Urzúa"><option value="Francisco Silva"><option value="Gabriela Videla"><option value="Luis Meza">
    </datalist>
    <datalist id="variedades">
      <option value="Santina"><option value="Nimba"><option value="Pacific Red"><option value="Sweet Aryana">
      <option value="Lapins"><option value="Regina"><option value="Skeena"><option value="Royal Dawn">
      <option value="Kordia"><option value="Bing"><option value="Sweetheart">
    </datalist>
  </section>

  <section>
    <h2>Foto de la muestra</h2>
    <div class="photo">
      <img id="photoPreview" alt="Foto de la muestra" hidden>
      <div class="empty" id="photoEmpty">Toma una foto de la muestra para adjuntarla al informe.</div>
      <div class="photo-actions">
        <button class="btn primary grow" id="btnCam" type="button">Tomar foto</button>
        <button class="btn ghost grow" id="btnGal" type="button">Galería</button>
        <button class="btn ghost" id="btnDelPhoto" type="button" hidden aria-label="Quitar foto">Quitar</button>
      </div>
      <input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
      <input type="file" id="fileGal" accept="image/*" hidden>
    </div>
  </section>

  <section>
    <h2>Conteo por categoría</h2>
    <div class="list" id="list"></div>
  </section>

  <section>
    <h2>Resultado</h2>
    <div class="result">
      <div class="big">
        <div class="kpi bad"><div class="v" id="pctDef">0%</div><div class="l">Defectos</div></div>
        <div class="kpi good"><div class="v" id="pctExp">0%</div><div class="l">Exportable</div></div>
      </div>
      <div class="bar" aria-hidden="true"><span id="barDef" style="background:var(--magenta);width:0"></span><span id="barExp" style="background:var(--ok);width:0"></span></div>
      <div class="total"><span>Total muestra</span><b id="totalTxt">0 frutos</b></div>
    </div>
  </section>
</main>

<div class="dock"><div class="inner">
  <button class="btn ghost" id="btnReset" type="button">Nueva muestra</button>
  <button class="btn primary grow" id="btnReport" type="button">Generar imagen</button>
</div></div>

<dialog id="dlg">
  <div class="dlg-body"><img id="reportImg" alt="Informe de defectos"></div>
  <div class="dlg-actions">
    <button class="btn primary grow" id="btnShare" type="button">Compartir</button>
    <button class="btn ghost grow" id="btnSave" type="button">Guardar imagen</button>
    <button class="btn ghost" id="btnClose" type="button">Cerrar</button>
  </div>
</dialog>
<div class="toast" id="toast" role="status"></div>

document.getElementById("logoSvg").innerHTML = LOGO;
const logoDataUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">${LOGO}</svg>`);
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}

// Ícono de pantalla de inicio (generado)
loadImg(logoDataUrl).then(img=>{
  const c=document.createElement("canvas");c.width=c.height=512;const x=c.getContext("2d");
  x.fillStyle="#FFF5F9";x.fillRect(0,0,512,512);x.drawImage(img,76,66,360,360);
  x.fillStyle="#B80F63";x.font="800 64px 'Bricolage Grotesque', sans-serif";x.textAlign="center";
  const url=c.toDataURL("image/png");
  const l=document.createElement("link");l.rel="apple-touch-icon";l.href=url;document.head.appendChild(l);
  const f=document.createElement("link");f.rel="icon";f.href=logoDataUrl;document.head.appendChild(f);
  try{
    const m={name:"Frutea Control de defectos",short_name:"Defectos",display:"standalone",background_color:"#FBF6F8",theme_color:"#B80F63",start_url:location.href,icons:[{src:url,sizes:"512x512",type:"image/png"}]};
    const ml=document.createElement("link");ml.rel="manifest";ml.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));document.head.appendChild(ml);
  }catch(e){}
}).catch(()=>{});

// ---------- Estado ----------
const KEY="frutea-defectos-v1";
const DEFAULTS=["Pitting","Machucón","Sin pedicelo","Picada de pájaro","Falta de color","Precalibre","Partidura","Frutos dobles"];
let state={info:{productor:"",cuartel:"",variedad:"",fecha:"",evaluador:""},defects:DEFAULTS.map(n=>({name:n,n:0,custom:false})),exportable:0,photo:null};
function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.defects)state=Object.assign(state,s);}catch(e){}
// Migración: renombrar y sumar defectos nuevos a listas guardadas
state.defects.forEach(d=>{if(!d.custom&&d.name==="Fruta light")d.name="Falta de color";});
{const fixed=DEFAULTS.map(n=>state.defects.find(d=>!d.custom&&d.name===n)||{name:n,n:0,custom:false});
 const extra=state.defects.filter(d=>d.custom||!DEFAULTS.includes(d.name));
 extra.forEach(d=>{if(!d.custom&&!DEFAULTS.includes(d.name))d.custom=true;});
 state.defects=fixed.concat(extra.filter(d=>!(d.custom&&DEFAULTS.includes(d.name.trim()))));}
state.photo=null; // la foto no se guarda entre sesiones
if(!state.info.fecha)state.info.fecha=today();
function save(){try{const{photo,...rest}=state;localStorage.setItem(KEY,JSON.stringify(rest));}catch(e){}}

// ---------- Datos ----------
["productor","cuartel","variedad","fecha","evaluador"].forEach(id=>{
  const el=document.getElementById(id);el.value=state.info[id]||"";
  el.addEventListener("input",()=>{state.info[id]=el.value;save();});
});
// Si cambia el productor, se reinician huerto, variedad y fecha
let lastProductor=state.info.productor||"";
document.getElementById("productor").addEventListener("change",e=>{
  const v=e.target.value.trim();
  if(lastProductor&&v!==lastProductor){
    state.info.cuartel="";state.info.variedad="";state.info.fecha=today();
    document.getElementById("cuartel").value="";document.getElementById("variedad").value="";document.getElementById("fecha").value=state.info.fecha;
    save();toast("Productor cambiado: huerto, variedad y fecha reiniciados");
  }
  lastProductor=v;
});

// ---------- Lista ----------
const list=document.getElementById("list");
function totals(){const def=state.defects.reduce((a,d)=>a+(+d.n||0),0);const exp=+state.exportable||0;return{def,exp,total:def+exp};}
function pct(n,t){return t?(n*100/t):0;}
function fmt(p){return (Math.round(p*10)/10).toLocaleString("es-CL",{maximumFractionDigits:1})+"%";}

function stepper(get,set){
  const w=document.createElement("div");w.className="stepper";
  const minus=document.createElement("button");minus.type="button";minus.textContent="−";minus.setAttribute("aria-label","Restar");
  const inp=document.createElement("input");inp.type="number";inp.inputMode="numeric";inp.min="0";inp.value=get();
  const plus=document.createElement("button");plus.type="button";plus.textContent="+";plus.setAttribute("aria-label","Sumar");
  minus.onclick=()=>{set(Math.max(0,get()-1));inp.value=get();update();};
  plus.onclick=()=>{set(get()+1);inp.value=get();update();if(navigator.vibrate)navigator.vibrate(8);};
  inp.oninput=()=>{const v=Math.max(0,parseInt(inp.value,10)||0);set(v);update();};
  inp.onfocus=()=>inp.select();
  w.append(minus,inp,plus);return w;
}
function render(){
  list.innerHTML="";
  state.defects.forEach((d,i)=>{
    const r=document.createElement("div");r.className="row";
    const nm=document.createElement("div");nm.className="name";
    if(d.custom){
      const ni=document.createElement("input");ni.type="text";ni.value=d.name;ni.placeholder="Nombre del defecto";
      ni.oninput=()=>{d.name=ni.value;save();};
      const del=document.createElement("button");del.className="del";del.type="button";del.textContent="Quitar";
      del.onclick=()=>{state.defects.splice(i,1);save();render();};
      nm.append(ni,del);
    }else nm.textContent=d.name;
    const p=document.createElement("div");p.className="pct";p.dataset.idx=i;
    r.append(nm,stepper(()=>+d.n||0,v=>{d.n=v;}),p);list.appendChild(r);
  });
  const add=document.createElement("button");add.type="button";add.className="btn add";add.textContent="+ Agregar defecto";
  add.onclick=()=>{state.defects.push({name:"",n:0,custom:true});save();render();const ins=list.querySelectorAll(".name input");ins[ins.length-1].focus();};
  list.appendChild(add);
  const r=document.createElement("div");r.className="row export";
  const nm=document.createElement("div");nm.className="name";nm.textContent="Exportable (sanos)";
  const p=document.createElement("div");p.className="pct";p.id="pctExpRow";
  r.append(nm,stepper(()=>+state.exportable||0,v=>{state.exportable=v;}),p);list.appendChild(r);
  update();
}
function update(){
  const t=totals();
  list.querySelectorAll(".pct[data-idx]").forEach(el=>{const d=state.defects[+el.dataset.idx];el.textContent=fmt(pct(+d.n||0,t.total));});
  const pe=document.getElementById("pctExpRow");if(pe)pe.textContent=fmt(pct(t.exp,t.total));
  document.getElementById("pctDef").textContent=fmt(pct(t.def,t.total));
  document.getElementById("pctExp").textContent=fmt(pct(t.exp,t.total));
  document.getElementById("barDef").style.width=pct(t.def,t.total)+"%";
  document.getElementById("barExp").style.width=pct(t.exp,t.total)+"%";
  document.getElementById("totalTxt").textContent=t.total+(t.total===1?" fruto":" frutos");
  save();
}
render();

// ---------- Foto ----------
const prev=document.getElementById("photoPreview"),empty=document.getElementById("photoEmpty"),delP=document.getElementById("btnDelPhoto");
document.getElementById("btnCam").onclick=()=>document.getElementById("fileCam").click();
document.getElementById("btnGal").onclick=()=>document.getElementById("fileGal").click();
function onFile(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const url=URL.createObjectURL(f);
  loadImg(url).then(img=>{
    const max=1600,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    state.photo=c.toDataURL("image/jpeg",.86);URL.revokeObjectURL(url);showPhoto();
  }).catch(()=>toast("No se pudo leer la foto. Intenta con otra."));
  e.target.value="";
}
document.getElementById("fileCam").onchange=onFile;
document.getElementById("fileGal").onchange=onFile;
delP.onclick=()=>{state.photo=null;showPhoto();};
function showPhoto(){
  if(state.photo){prev.src=state.photo;prev.hidden=false;empty.hidden=true;delP.hidden=false;}
  else{prev.removeAttribute("src");prev.hidden=true;empty.hidden=false;delP.hidden=true;}
}

// ---------- Nueva muestra ----------
const btnReset=document.getElementById("btnReset");let resetArmed=null;
btnReset.onclick=()=>{
  if(!resetArmed){
    btnReset.textContent="¿Borrar conteo?";btnReset.classList.replace("ghost","primary");
    resetArmed=setTimeout(()=>{resetArmed=null;btnReset.textContent="Nueva muestra";btnReset.classList.replace("primary","ghost");},3000);
    return;
  }
  clearTimeout(resetArmed);resetArmed=null;btnReset.textContent="Nueva muestra";btnReset.classList.replace("primary","ghost");
  state.defects=state.defects.filter(d=>!d.custom||d.name.trim()).map(d=>({...d,n:0}));
  state.exportable=0;state.photo=null;
  showPhoto();render();window.scrollTo({top:0,behavior:"smooth"});toast("Nueva muestra lista");
};

// ---------- Informe (imagen) ----------
let reportBlob=null,reportName="";
function rr(x,X,y,w,h,r){x.beginPath();x.moveTo(X+r,y);x.arcTo(X+w,y,X+w,y+h,r);x.arcTo(X+w,y+h,X,y+h,r);x.arcTo(X,y+h,X,y,r);x.arcTo(X,y,X+w,y,r);x.closePath();}
async function buildReport(){
  const t=totals();
  try{await document.fonts.load("800 40px 'Bricolage Grotesque'");await document.fonts.load("400 30px 'Bricolage Grotesque'");await document.fonts.load("600 30px 'Bricolage Grotesque'");}catch(e){}
  const F="'Bricolage Grotesque', system-ui, sans-serif";
  const W=1080,P=56;
  const brand=await loadImg(document.querySelector(".brandlogo").src);
  const photo=state.photo?await loadImg(state.photo):null;
  const photoH=photo?Math.min(860,Math.round((W-2*P)*photo.naturalHeight/photo.naturalWidth)):0;
  const rows=[...state.defects.filter(d=>!(d.custom&&!d.name.trim()&&!(+d.n))).map(d=>({name:d.name.trim()||"Otro defecto",n:+d.n||0,exp:false})),{name:"Exportable (sanos)",n:t.exp,exp:true}];
  const rowH=64;
  const infoItems=[["Productor",state.info.productor],["Huerto / cuartel",state.info.cuartel],["Variedad",state.info.variedad],["Fecha",fmtDate(state.info.fecha)],["Evaluador",state.info.evaluador]].filter(a=>a[1]);
  const infoH=Math.ceil(infoItems.length/2)*78;
  const H=170+P+infoH+(infoItems.length?24:0)+(photo?photoH+40:0)+70+rowH*(rows.length+1)+40+190+90;
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle="#FFFFFF";x.fillRect(0,0,W,H);
  // Encabezado
  x.fillStyle="#B80F63";x.fillRect(0,0,W,170);
  x.drawImage(brand,P,36,Math.round(98*brand.naturalWidth/brand.naturalHeight),98);
  x.fillStyle="#fff";x.textBaseline="middle";
  x.textAlign="right";x.font=`600 30px ${F}`;x.fillText("Control de calidad",W-P,66);
  x.font=`400 28px ${F}`;x.globalAlpha=.9;x.fillText("Planilla de defectos",W-P,104);x.globalAlpha=1;x.textAlign="left";
  let y=170+P;
  // Datos
  x.textBaseline="alphabetic";
  infoItems.forEach((it,i)=>{
    const col=i%2,X=P+col*((W-2*P)/2),Y=y+Math.floor(i/2)*78;
    x.fillStyle="#7A6670";x.font=`400 24px ${F}`;x.fillText(it[0],X,Y+22);
    x.fillStyle="#24131B";x.font=`600 32px ${F}`;x.fillText(clip(x,it[1],(W-2*P)/2-20),X,Y+60);
  });
  y+=infoH+(infoItems.length?24:0);
  // Foto
  if(photo){
    const w=W-2*P;x.save();rr(x,P,y,w,photoH,22);x.clip();
    const s=Math.max(w/photo.naturalWidth,photoH/photo.naturalHeight),dw=photo.naturalWidth*s,dh=photo.naturalHeight*s;
    x.drawImage(photo,P+(w-dw)/2,y+(photoH-dh)/2,dw,dh);x.restore();y+=photoH+40;
  }
  // KPIs (primero, bajo la foto)
  const bw=(W-2*P-24)/2;
  x.textBaseline="alphabetic";
  [[fmt(pct(t.def,t.total)),"Defectos",`${t.def} de ${t.total} frutos`,"#FBE4EC","#B80F63"],[fmt(pct(t.exp,t.total)),"Exportable",`${t.exp} de ${t.total} frutos`,"#E5F2E6","#2F7A3E"]].forEach((k,i)=>{
    const X=P+i*(bw+24);x.fillStyle=k[3];rr(x,X,y,bw,170,20);x.fill();
    x.fillStyle=k[4];x.font=`800 84px ${F}`;x.textBaseline="alphabetic";x.fillText(k[0],X+28,y+96);
    x.fillStyle="#24131B";x.font=`600 30px ${F}`;x.fillText(k[1],X+28,y+136);
    x.fillStyle="#7A6670";x.font=`400 24px ${F}`;x.textAlign="right";x.fillText(k[2],X+bw-24,y+136);x.textAlign="left";
  });
  y+=210;
  // Tabla
  x.fillStyle="#5C0B30";x.font=`800 36px ${F}`;x.fillText("Detalle de la muestra",P,y+36);y+=70;
  const cx=[P+24,P+560,W-P-24];
  x.fillStyle="#F8E7EF";rr(x,P,y,W-2*P,rowH,14);x.fill();
  x.fillStyle="#5C0B30";x.font=`600 28px ${F}`;x.textBaseline="middle";
  x.fillText("Categoría",cx[0],y+rowH/2);x.textAlign="right";x.fillText("Cantidad",cx[1]+80,y+rowH/2);x.fillText("Porcentaje",cx[2],y+rowH/2);x.textAlign="left";
  y+=rowH;
  rows.forEach((r)=>{
    if(r.exp){x.fillStyle="#E5F2E6";x.fillRect(P,y,W-2*P,rowH);}
    x.strokeStyle="#EADDE3";x.lineWidth=2;x.beginPath();x.moveTo(P,y);x.lineTo(W-P,y);x.stroke();
    x.fillStyle=r.exp?"#2F7A3E":"#24131B";x.font=`${r.exp?600:400} 30px ${F}`;
    x.fillText(clip(x,r.name,480),cx[0],y+rowH/2);x.textAlign="right";
    x.font=`600 30px ${F}`;x.fillText(String(r.n),cx[1]+80,y+rowH/2);x.fillText(fmt(pct(r.n,t.total)),cx[2],y+rowH/2);x.textAlign="left";
    y+=rowH;
  });
  x.strokeStyle="#24131B";x.lineWidth=3;x.beginPath();x.moveTo(P,y);x.lineTo(W-P,y);x.stroke();
  x.fillStyle="#24131B";x.font=`800 30px ${F}`;x.fillText("Total muestra",cx[0],y+rowH/2+4);x.textAlign="right";x.fillText(String(t.total),cx[1]+80,y+rowH/2+4);x.fillText("100%",cx[2],y+rowH/2+4);x.textAlign="left";
  y+=rowH+20;
  x.textBaseline="alphabetic";
  x.fillStyle="#7A6670";x.font=`400 22px ${F}`;x.fillText("Generado con Frutea · Control de defectos",P,y+40);
  const name=["Defectos",state.info.productor,state.info.cuartel,state.info.fecha].filter(Boolean).join("_").replace(/[^\wáéíóúñÁÉÍÓÚÑ\-]+/g,"-");
  reportName=name+".png";
  return new Promise(res=>c.toBlob(b=>res(b),"image/png"));
}
function clip(x,s,max){s=String(s);if(x.measureText(s).width<=max)return s;while(s.length&&x.measureText(s+"…").width>max)s=s.slice(0,-1);return s+"…";}
function fmtDate(v){if(!v)return"";const[a,m,d]=v.split("-");return `${d}-${m}-${a}`;}

const dlg=document.getElementById("dlg"),rimg=document.getElementById("reportImg");
document.getElementById("btnReport").onclick=async()=>{
  const t=totals();
  if(!t.total){toast("Ingresa al menos un fruto en el conteo.");return;}
  const b=document.getElementById("btnReport");b.disabled=true;b.textContent="Generando…";
  try{
    reportBlob=await buildReport();
    if(rimg.src)URL.revokeObjectURL(rimg.src);
    rimg.src=URL.createObjectURL(reportBlob);
    dlg.showModal();
  }catch(e){toast("No se pudo generar la imagen.");}
  b.disabled=false;b.textContent="Generar imagen";
};
document.getElementById("btnClose").onclick=()=>dlg.close();

// Guardar: usa la descarga de claude.ai si está disponible; si no (p. ej. GitHub Pages) descarga directa
let downloads=null;
if(window.claude&&typeof window.claude.use==="function"){window.claude.use("downloads").then(d=>{downloads=d;}).catch(()=>{});}
document.getElementById("btnSave").onclick=async()=>{
  if(!reportBlob)return;
  if(downloads){
    try{await downloads.save({filename:reportName,data:reportBlob});toast("Imagen guardada");}
    catch(e){if(e&&e.code!=="declined")toast("No se pudo guardar en esta vista.");}
    return;
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(reportBlob);a.download=reportName;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("Imagen guardada");
};
const shareBtn=document.getElementById("btnShare");
document.getElementById("btnShare").onclick=async()=>{
  if(!reportBlob)return;
  const file=new File([reportBlob],reportName,{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:"Control de defectos",text:`Defectos ${document.getElementById("pctDef").textContent} · Exportable ${document.getElementById("pctExp").textContent}`});}
    catch(e){if(e&&e.name!=="AbortError")toast("No se pudo compartir.");}
  }else{
    toast("Compartir no está disponible aquí. Usa Guardar imagen.");
  }
};

let tt;function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),2600);}
showPhoto();
})();
</script>
</body>
