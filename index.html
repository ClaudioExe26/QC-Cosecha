<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frutea · Control de defectos</title>
<meta name="theme-color" content="#B80F63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Defectos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header>
  <div class="hbar">
    <img class="brandlogo" src="logo-frutea.png" alt="Frutea Group">
    <span class="brand-sub">Control de<br>defectos</span>
  </div>
</header>

<main id="viewMuestra">
  <div class="banner" id="netBanner" hidden></div>
  <section>
    <h2>Datos de la muestra</h2>
    <div class="fields">
      <label class="f full">Productor<select id="productor"></select></label>
      <label class="f">Huerto / cuartel<input type="text" id="cuartel" autocomplete="off"></label>
      <label class="f">Variedad<input type="text" id="variedad" autocomplete="off" list="variedades"></label>
      <label class="f">Fecha<input type="date" id="fecha"></label>
      <label class="f">Evaluador<input type="text" id="evaluador" autocomplete="off"></label>
    </div>
    <datalist id="variedades"></datalist>
  </section>

  <section>
    <h2>Foto de la muestra</h2>
    <div class="photo">
      <img id="photoPreview" alt="Foto de la muestra" hidden>
      <div class="empty" id="photoEmpty">Toma una foto de la muestra para adjuntarla a la ficha. La foto no se guarda en la base de datos.</div>
      <div class="photo-actions">
        <button class="btn primary grow" id="btnCam" type="button">Tomar foto</button>
        <button class="btn ghost grow" id="btnGal" type="button">Galería</button>
        <button class="btn ghost" id="btnDelPhoto" type="button" hidden>Quitar</button>
      </div>
      <input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
      <input type="file" id="fileGal" accept="image/*" hidden>
    </div>
  </section>

  <section>
    <h2>Conteo por categoría</h2>
    <div class="list" id="list"></div>
  </section>

  <section>
    <h2>Resultado</h2>
    <div class="card">
      <div class="big">
        <div class="kpi bad"><div class="v" id="pctDef">0%</div><div class="l">Defectos</div></div>
        <div class="kpi good"><div class="v" id="pctExp">0%</div><div class="l">Exportable</div></div>
      </div>
      <div class="bar" aria-hidden="true"><span id="barDef" style="background:var(--magenta);width:0"></span><span id="barExp" style="background:var(--ok);width:0"></span></div>
      <div class="total"><span>Total muestra <b id="totalTxt">0 frutos</b></span><span class="chip no" id="saveChip">Sin enviar</span></div>
    </div>
  </section>
</main>

<div class="dock" id="dock"><div class="inner">
  <button class="btn ghost" id="btnReset" type="button">Nueva</button>
  <button class="btn primary grow" id="btnSend" type="button">Enviar muestra</button>
</div></div>

<dialog id="dlg">
  <div class="dlg-head" id="dlgHead">Muestra enviada ✓</div>
  <div class="dlg-body"><img id="reportImg" alt="Ficha de defectos"></div>
  <div class="dlg-actions">
    <button class="btn primary grow" id="btnShare" type="button" style="flex-basis:100%">Compartir por WhatsApp</button>
    <button class="btn ghost grow" id="btnSaveImg" type="button">Guardar imagen</button>
    <button class="btn ghost grow" id="btnNext" type="button">Nueva muestra</button>
    <button class="btn ghost" id="btnClose" type="button">Cerrar</button>
  </div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { PRODUCTORES, VARIEDADES, DEFECTOS } from "./config.js";
import { $, toast, today, nowTime, pct, fmt, fmtDate, esc, loadImg, downloadBlob, initFirebase, setupIcon, fillSelect, COLECCION } from "./comun.js";

setupIcon("Frutea Control de defectos", "Defectos");
fillSelect($("productor"), "Selecciona productor", PRODUCTORES);
$("variedades").innerHTML = VARIEDADES.map(v => `<option value="${esc(v)}">`).join("");
function newId() { return today().replace(/-/g, "") + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7); }

// ===================== BASE DE DATOS (solo escritura) =====================
let FB = null, currentUser = null;
initFirebase().then(fb => {
  FB = fb;
  const anon = () => fb.fa.signInAnonymously(fb.auth).catch(e => console.warn("Sin sesión todavía", e.code));
  window.addEventListener("online", () => { if (!currentUser) anon(); });
  fb.fa.onAuthStateChanged(fb.auth, u => { currentUser = u; if (!u) anon(); $("netBanner").hidden = true; });
}).catch(e => {
  console.error(e);
  const b = $("netBanner"); b.hidden = false; b.textContent = "No se pudo conectar con la base de datos. Revisa la señal y vuelve a abrir la app.";
});
async function saveToDb(id, data, isNew) {
  const { fs, db } = FB;
  const payload = { ...data, id, actualizadoEn: fs.serverTimestamp() };
  if (isNew) { payload.creadoEn = fs.serverTimestamp(); payload.creadoPorUid = currentUser.uid; }
  const p = fs.setDoc(fs.doc(db, COLECCION, id), payload, { merge: true });
  // Sin señal, la escritura queda en cola en el teléfono y se envía al volver la conexión
  const r = await Promise.race([p.then(() => "ok"), new Promise(res => setTimeout(() => res("pending"), 2500))]);
  p.catch(err => { console.error(err); toast(err.code === "permission-denied" ? "La base rechazó la muestra. Avisa al administrador." : "Error al enviar a la base de datos.", 4500); });
  return { pending: r === "pending" };
}

// ===================== ESTADO =====================
const KEY = "frutea-defectos-v1";
let state = { info: { productor: "", cuartel: "", variedad: "", fecha: "", evaluador: "" }, defects: DEFECTOS.map(n => ({ name: n, n: 0, custom: false })), exportable: 0, photo: null, sampleId: null, savedHash: null, everSaved: false, hora: null };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.defects) state = Object.assign(state, s); } catch (e) { }
state.photo = null;
state.defects.forEach(d => { if (!d.custom && d.name === "Fruta light") d.name = "Falta de color"; });
{
  const fixed = DEFECTOS.map(n => state.defects.find(d => !d.custom && d.name === n) || { name: n, n: 0, custom: false });
  const extra = state.defects.filter(d => d.custom || !DEFECTOS.includes(d.name));
  extra.forEach(d => { if (!d.custom && !DEFECTOS.includes(d.name)) d.custom = true; });
  state.defects = fixed.concat(extra.filter(d => !(d.custom && DEFECTOS.includes(d.name.trim()))));
}
if (!PRODUCTORES.includes(state.info.productor)) state.info.productor = "";
if (!state.info.fecha) state.info.fecha = today();
if (!state.sampleId) { state.sampleId = newId(); state.savedHash = null; state.everSaved = false; }
function saveLocal() { try { const { photo, ...rest } = state; localStorage.setItem(KEY, JSON.stringify(rest)); } catch (e) { } }

["productor", "cuartel", "variedad", "fecha", "evaluador"].forEach(id => {
  const el = $(id); el.value = state.info[id] || "";
  el.addEventListener("input", () => { state.info[id] = el.value; update(); });
});
let lastProductor = state.info.productor || "";
$("productor").addEventListener("change", e => {
  const v = e.target.value;
  if (lastProductor && v !== lastProductor) {
    state.info.cuartel = ""; state.info.variedad = ""; state.info.fecha = today();
    $("cuartel").value = ""; $("variedad").value = ""; $("fecha").value = state.info.fecha;
    update(); toast("Productor cambiado: huerto, variedad y fecha reiniciados");
  }
  state.info.productor = v; lastProductor = v; update();
});

// ===================== CONTEO =====================
const list = $("list");
function totals() { const def = state.defects.reduce((a, d) => a + (+d.n || 0), 0); const exp = +state.exportable || 0; return { def, exp, total: def + exp }; }
function stepper(get, set) {
  const w = document.createElement("div"); w.className = "stepper";
  const minus = document.createElement("button"); minus.type = "button"; minus.textContent = "−"; minus.setAttribute("aria-label", "Restar");
  const inp = document.createElement("input"); inp.type = "number"; inp.inputMode = "numeric"; inp.min = "0"; inp.value = get();
  const plus = document.createElement("button"); plus.type = "button"; plus.textContent = "+"; plus.setAttribute("aria-label", "Sumar");
  minus.onclick = () => { set(Math.max(0, get() - 1)); inp.value = get(); update(); };
  plus.onclick = () => { set(get() + 1); inp.value = get(); update(); if (navigator.vibrate) navigator.vibrate(8); };
  inp.oninput = () => { set(Math.max(0, parseInt(inp.value, 10) || 0)); update(); };
  inp.onfocus = () => inp.select();
  w.append(minus, inp, plus); return w;
}
function render() {
  list.innerHTML = "";
  state.defects.forEach((d, i) => {
    const r = document.createElement("div"); r.className = "row";
    const nm = document.createElement("div"); nm.className = "name";
    if (d.custom) {
      const ni = document.createElement("input"); ni.type = "text"; ni.value = d.name; ni.placeholder = "Nombre del defecto";
      ni.oninput = () => { d.name = ni.value; update(); };
      const del = document.createElement("button"); del.className = "del"; del.type = "button"; del.textContent = "Quitar";
      del.onclick = () => { state.defects.splice(i, 1); render(); };
      nm.append(ni, del);
    } else nm.textContent = d.name;
    const p = document.createElement("div"); p.className = "pct"; p.dataset.idx = i;
    r.append(nm, stepper(() => +d.n || 0, v => { d.n = v; }), p); list.appendChild(r);
  });
  const add = document.createElement("button"); add.type = "button"; add.className = "btn add"; add.textContent = "+ Agregar defecto";
  add.onclick = () => { state.defects.push({ name: "", n: 0, custom: true }); render(); const ins = list.querySelectorAll(".name input"); ins[ins.length - 1].focus(); };
  list.appendChild(add);
  const r = document.createElement("div"); r.className = "row export";
  const nm = document.createElement("div"); nm.className = "name"; nm.textContent = "Exportable (sanos)";
  const p = document.createElement("div"); p.className = "pct"; p.id = "pctExpRow";
  r.append(nm, stepper(() => +state.exportable || 0, v => { state.exportable = v; }), p); list.appendChild(r);
  update();
}
function sampleData() {
  const t = totals(), defectos = {};
  state.defects.forEach(d => { const nm = d.name.trim() || (+d.n ? "Otro defecto" : ""); if (!nm) return; defectos[nm] = (defectos[nm] || 0) + (+d.n || 0); });
  return {
    productor: state.info.productor, cuartel: state.info.cuartel.trim(), variedad: state.info.variedad.trim(),
    fecha: state.info.fecha || today(), evaluador: state.info.evaluador.trim(),
    defectos, exportable: t.exp, totalDefectos: t.def, total: t.total,
    pctExportable: Math.round(pct(t.exp, t.total) * 100) / 100, pctDefectos: Math.round(pct(t.def, t.total) * 100) / 100
  };
}
const hashOf = d => JSON.stringify(d);
function update() {
  const t = totals();
  list.querySelectorAll(".pct[data-idx]").forEach(el => { const d = state.defects[+el.dataset.idx]; if (d) el.textContent = fmt(pct(+d.n || 0, t.total)); });
  const pe = $("pctExpRow"); if (pe) pe.textContent = fmt(pct(t.exp, t.total));
  $("pctDef").textContent = fmt(pct(t.def, t.total)); $("pctExp").textContent = fmt(pct(t.exp, t.total));
  $("barDef").style.width = pct(t.def, t.total) + "%"; $("barExp").style.width = pct(t.exp, t.total) + "%";
  $("totalTxt").textContent = t.total + (t.total === 1 ? " fruto" : " frutos");
  const chip = $("saveChip");
  if (!state.everSaved) { chip.className = "chip no"; chip.textContent = "Sin enviar"; }
  else if (hashOf(sampleData()) === state.savedHash) { chip.className = "chip ok"; chip.textContent = "Enviada ✓"; }
  else { chip.className = "chip warn"; chip.textContent = "Cambios sin enviar"; }
  saveLocal();
}
render();

// ===================== ENVIAR (un solo botón) =====================
let lastPending = false;
async function saveSample() {
  const d = sampleData();
  if (!d.total) { toast("Ingresa al menos un fruto en el conteo."); return false; }
  if (!d.productor) { toast("Selecciona el productor."); $("productor").focus(); return false; }
  if (!d.variedad) { toast("Completa la variedad."); $("variedad").focus(); return false; }
  if (!d.evaluador) { toast("Escribe tu nombre en Evaluador para enviar."); $("evaluador").focus(); return false; }
  if (!FB || !currentUser) { toast("Sin conexión con la base todavía. Abre la app con señal una vez para activarla.", 4500); return false; }
  if (state.everSaved && hashOf(d) === state.savedHash) { lastPending = false; return true; }
  const isNew = !state.everSaved;
  const r = await saveToDb(state.sampleId, { ...d, hora: state.hora || (state.hora = nowTime()) }, isNew);
  state.savedHash = hashOf(d); state.everSaved = true; lastPending = r.pending; update();
  return true;
}
const dlg = $("dlg"), rimg = $("reportImg");
let reportBlob = null, reportName = "";
$("btnSend").onclick = async () => {
  const b = $("btnSend"); if (b.dataset.busy) return; b.dataset.busy = "1";
  const label = b.textContent; b.textContent = "Enviando…";
  try {
    const wasSaved = state.everSaved;
    if (!(await saveSample())) return;
    b.textContent = "Generando ficha…";
    reportBlob = await buildReport();
    if (rimg.src) URL.revokeObjectURL(rimg.src);
    rimg.src = URL.createObjectURL(reportBlob);
    const h = $("dlgHead"); h.className = "dlg-head" + (lastPending ? " warn" : "");
    h.textContent = lastPending ? "Guardada en el teléfono · se envía al tener señal" : (wasSaved ? "Muestra actualizada ✓" : "Muestra enviada ✓");
    dlg.showModal();
  } catch (e) { console.error(e); toast("No se pudo generar la ficha."); }
  finally { b.textContent = label; delete b.dataset.busy; }
};

// ===================== FOTO =====================
const prev = $("photoPreview"), empty = $("photoEmpty"), delP = $("btnDelPhoto");
$("btnCam").onclick = () => $("fileCam").click();
$("btnGal").onclick = () => $("fileGal").click();
function onFile(e) {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const url = URL.createObjectURL(f);
  loadImg(url).then(img => {
    const max = 1600, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    state.photo = c.toDataURL("image/jpeg", .86); URL.revokeObjectURL(url); showPhoto();
  }).catch(() => toast("No se pudo leer la foto. Intenta con otra."));
  e.target.value = "";
}
$("fileCam").onchange = onFile; $("fileGal").onchange = onFile;
delP.onclick = () => { state.photo = null; showPhoto(); };
function showPhoto() {
  if (state.photo) { prev.src = state.photo; prev.hidden = false; empty.hidden = true; delP.hidden = false; }
  else { prev.removeAttribute("src"); prev.hidden = true; empty.hidden = false; delP.hidden = true; }
}
showPhoto();

// ===================== NUEVA MUESTRA =====================
function doReset() {
  state.defects = state.defects.filter(d => !d.custom || d.name.trim()).map(d => ({ ...d, n: 0 }));
  state.exportable = 0; state.photo = null;
  state.sampleId = newId(); state.savedHash = null; state.everSaved = false; state.hora = null;
  showPhoto(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); toast("Nueva muestra lista");
}
const btnReset = $("btnReset"); let resetArmed = null;
function disarm() { clearTimeout(resetArmed); resetArmed = null; btnReset.textContent = "Nueva"; btnReset.classList.replace("primary", "ghost"); }
btnReset.onclick = () => {
  const t = totals(); const dirty = t.total > 0 && (!state.everSaved || hashOf(sampleData()) !== state.savedHash);
  if (!resetArmed && t.total > 0) {
    btnReset.textContent = dirty ? "Sin enviar: ¿borrar?" : "¿Nueva muestra?"; btnReset.classList.replace("ghost", "primary");
    resetArmed = setTimeout(disarm, 3500); return;
  }
  disarm(); doReset();
};

// ===================== FICHA (imagen) =====================
function rr(x, X, y, w, h, r) { x.beginPath(); x.moveTo(X + r, y); x.arcTo(X + w, y, X + w, y + h, r); x.arcTo(X + w, y + h, X, y + h, r); x.arcTo(X, y + h, X, y, r); x.arcTo(X, y, X + w, y, r); x.closePath(); }
function clip(x, s, max) { s = String(s); if (x.measureText(s).width <= max) return s; while (s.length && x.measureText(s + "…").width > max) s = s.slice(0, -1); return s + "…"; }
async function buildReport() {
  const t = totals();
  try { await document.fonts.load("800 40px 'Bricolage Grotesque'"); await document.fonts.load("400 30px 'Bricolage Grotesque'"); await document.fonts.load("600 30px 'Bricolage Grotesque'"); } catch (e) { }
  const F = "'Bricolage Grotesque', system-ui, sans-serif";
  const W = 1080, P = 56;
  const brand = await loadImg(document.querySelector(".brandlogo").src);
  const photo = state.photo ? await loadImg(state.photo) : null;
  const photoH = photo ? Math.min(860, Math.round((W - 2 * P) * photo.naturalHeight / photo.naturalWidth)) : 0;
  const rows = [...state.defects.filter(d => !(d.custom && !d.name.trim() && !(+d.n))).map(d => ({ name: d.name.trim() || "Otro defecto", n: +d.n || 0, exp: false })), { name: "Exportable (sanos)", n: t.exp, exp: true }];
  const rowH = 64;
  const infoItems = [["Productor", state.info.productor], ["Huerto / cuartel", state.info.cuartel], ["Variedad", state.info.variedad], ["Fecha", fmtDate(state.info.fecha)], ["Evaluador", state.info.evaluador]].filter(a => a[1]);
  const infoH = Math.ceil(infoItems.length / 2) * 78;
  const H = 170 + P + infoH + (infoItems.length ? 24 : 0) + (photo ? photoH + 40 : 0) + 70 + rowH * (rows.length + 1) + 40 + 190 + 90;
  const c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d");
  x.fillStyle = "#FFFFFF"; x.fillRect(0, 0, W, H);
  x.fillStyle = "#B80F63"; x.fillRect(0, 0, W, 170);
  x.drawImage(brand, P, 36, Math.round(98 * brand.naturalWidth / brand.naturalHeight), 98);
  x.fillStyle = "#fff"; x.textBaseline = "middle"; x.textAlign = "right"; x.font = `600 30px ${F}`; x.fillText("Control de calidad", W - P, 66);
  x.font = `400 28px ${F}`; x.globalAlpha = .9; x.fillText("Planilla de defectos", W - P, 104); x.globalAlpha = 1; x.textAlign = "left";
  let y = 170 + P;
  x.textBaseline = "alphabetic";
  infoItems.forEach((it, i) => {
    const col = i % 2, X = P + col * ((W - 2 * P) / 2), Y = y + Math.floor(i / 2) * 78;
    x.fillStyle = "#7A6670"; x.font = `400 24px ${F}`; x.fillText(it[0], X, Y + 22);
    x.fillStyle = "#24131B"; x.font = `600 32px ${F}`; x.fillText(clip(x, it[1], (W - 2 * P) / 2 - 20), X, Y + 60);
  });
  y += infoH + (infoItems.length ? 24 : 0);
  if (photo) {
    const w = W - 2 * P; x.save(); rr(x, P, y, w, photoH, 22); x.clip();
    const s = Math.max(w / photo.naturalWidth, photoH / photo.naturalHeight), dw = photo.naturalWidth * s, dh = photo.naturalHeight * s;
    x.drawImage(photo, P + (w - dw) / 2, y + (photoH - dh) / 2, dw, dh); x.restore(); y += photoH + 40;
  }
  const bw = (W - 2 * P - 24) / 2;
  [[fmt(pct(t.def, t.total)), "Defectos", `${t.def} de ${t.total} frutos`, "#FBE4EC", "#B80F63"], [fmt(pct(t.exp, t.total)), "Exportable", `${t.exp} de ${t.total} frutos`, "#E5F2E6", "#2F7A3E"]].forEach((k, i) => {
    const X = P + i * (bw + 24); x.fillStyle = k[3]; rr(x, X, y, bw, 170, 20); x.fill();
    x.fillStyle = k[4]; x.font = `800 84px ${F}`; x.fillText(k[0], X + 28, y + 96);
    x.fillStyle = "#24131B"; x.font = `600 30px ${F}`; x.fillText(k[1], X + 28, y + 136);
    x.fillStyle = "#7A6670"; x.font = `400 24px ${F}`; x.textAlign = "right"; x.fillText(k[2], X + bw - 24, y + 136); x.textAlign = "left";
  });
  y += 210;
  x.fillStyle = "#5C0B30"; x.font = `800 36px ${F}`; x.fillText("Detalle de la muestra", P, y + 36); y += 70;
  const cx = [P + 24, P + 560, W - P - 24];
  x.fillStyle = "#F8E7EF"; rr(x, P, y, W - 2 * P, rowH, 14); x.fill();
  x.fillStyle = "#5C0B30"; x.font = `600 28px ${F}`; x.textBaseline = "middle";
  x.fillText("Categoría", cx[0], y + rowH / 2); x.textAlign = "right"; x.fillText("Cantidad", cx[1] + 80, y + rowH / 2); x.fillText("Porcentaje", cx[2], y + rowH / 2); x.textAlign = "left";
  y += rowH;
  rows.forEach(r => {
    if (r.exp) { x.fillStyle = "#E5F2E6"; x.fillRect(P, y, W - 2 * P, rowH); }
    x.strokeStyle = "#EADDE3"; x.lineWidth = 2; x.beginPath(); x.moveTo(P, y); x.lineTo(W - P, y); x.stroke();
    x.fillStyle = r.exp ? "#2F7A3E" : "#24131B"; x.font = `${r.exp ? 600 : 400} 30px ${F}`;
    x.fillText(clip(x, r.name, 480), cx[0], y + rowH / 2); x.textAlign = "right";
    x.font = `600 30px ${F}`; x.fillText(String(r.n), cx[1] + 80, y + rowH / 2); x.fillText(fmt(pct(r.n, t.total)), cx[2], y + rowH / 2); x.textAlign = "left";
    y += rowH;
  });
  x.strokeStyle = "#24131B"; x.lineWidth = 3; x.beginPath(); x.moveTo(P, y); x.lineTo(W - P, y); x.stroke();
  x.fillStyle = "#24131B"; x.font = `800 30px ${F}`; x.fillText("Total muestra", cx[0], y + rowH / 2 + 4); x.textAlign = "right"; x.fillText(String(t.total), cx[1] + 80, y + rowH / 2 + 4); x.fillText("100%", cx[2], y + rowH / 2 + 4); x.textAlign = "left";
  y += rowH + 20;
  x.textBaseline = "alphabetic";
  x.fillStyle = "#7A6670"; x.font = `400 22px ${F}`; x.fillText("Generado con Frutea · Control de defectos", P, y + 40);
  reportName = ["Defectos", state.info.productor, state.info.cuartel, state.info.fecha].filter(Boolean).join("_").replace(/[^\wáéíóúñÁÉÍÓÚÑ\-]+/g, "-") + ".png";
  return new Promise(res => c.toBlob(b => res(b), "image/png"));
}
$("btnClose").onclick = () => dlg.close();
$("btnNext").onclick = () => { dlg.close(); doReset(); };
$("btnSaveImg").onclick = () => { if (reportBlob) { downloadBlob(reportBlob, reportName); toast("Imagen guardada"); } };
$("btnShare").onclick = async () => {
  if (!reportBlob) return;
  const file = new File([reportBlob], reportName, { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: "Control de defectos", text: `Defectos ${$("pctDef").textContent} · Exportable ${$("pctExp").textContent}` }); }
    catch (e) { if (e && e.name !== "AbortError") toast("No se pudo compartir."); }
  } else toast("Compartir no está disponible aquí. Usa Guardar imagen.");
};
</script>
